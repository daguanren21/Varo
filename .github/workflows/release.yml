# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string

env:
  LEFTHOOK: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repoctl release
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          VARO_VERIFIED_RELEASE_SHA: ${{ github.sha }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm exec repo release ci
