name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source ownership and projections
        run: |
          pnpm check:generated
          pnpm check:architecture

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build packages and apps
        run: pnpm build

      - name: Verify fresh native build contracts
        run: pnpm test:contracts

      - name: Install deterministic Chromium runtime
        run: pnpm --filter @varo/e2e exec playwright-core install --with-deps chromium

      - name: Verify E2E failure and cancellation gates
        run: pnpm test:e2e:runner

      - name: Run browser and native headless E2E
        run: pnpm test:e2e

      - name: Preserve real E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: apps/e2e/.e2e/runs
          if-no-files-found: ignore

      - name: Verify isolated package and source consumers
        run: pnpm check:consumers

      - name: Verify native profile artifacts
        run: pnpm check:platforms
