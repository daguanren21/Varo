name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Smoke e2e contracts
        run: pnpm test:e2e

      - name: Build packages and apps
        run: pnpm build

      - name: Build docs
        run: pnpm --filter @varo/docs build

      - name: Build playgrounds
        run: |
          pnpm --filter @varo/playground-h5 build
          pnpm --filter @varo/playground-weapp build
