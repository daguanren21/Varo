packages:
  - apps/*
  - packages/*
  - examples/*

autoInstallPeers: false

minimumReleaseAge: 0
overrides:
  undici: 7.29.1

versioning:
  fixed:
    - ['@varo-ui/ai', '@varo-ui/cli', '@varo-ui/h5', '@varo-ui/headless', '@varo-ui/theme', '@varo-ui/weapp']
  changelog:
    storage: repository

allowBuilds:
  lefthook: false
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  '@tailwindcss/oxide': true
  sharp: true
  vue-demi: true
  workerd: true
  '@parcel/watcher': true

patchedDependencies:
  '@devframes/agentic@1.3.2': patches/@devframes__agentic@1.3.2.patch
  '@e2e-dev/web@0.15.4': patches/@e2e-dev__web@0.15.4.patch
  '@weapp-vite/miniprogram-automator@1.5.1': patches/@weapp-vite__miniprogram-automator@1.5.1.patch
  devframe@1.3.2: patches/devframe@1.3.2.patch
  weapp-vite@7.8.0: packages/ui-weapp/patches/weapp-vite@7.8.0.patch
